<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - This page is off the cliff</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #fff8ec;
      background: linear-gradient(#1b2a4a 0%, #6a3d6e 55%, #f08a4b 100%);
    }
    .star { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff; opacity: 0.8; }
    .cliff { position: absolute; left: 0; bottom: 0; width: 42vw; height: 62vh; }
    .page {
      position: absolute;
      left: 33vw;
      top: 36vh;
      width: 46px;
      height: 60px;
      background: #fff;
      border-radius: 3px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      animation: fall 4s ease-in infinite;
    }
    .page::before {
      content: "";
      position: absolute;
      left: 8px; right: 8px; top: 10px;
      height: 30px;
      background: repeating-linear-gradient(#c9ced8 0 3px, transparent 3px 8px);
    }
    @keyframes fall {
      0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
      15% { transform: translate(40px, -25px) rotate(-20deg); opacity: 1; }
      100% { transform: translate(160px, 70vh) rotate(560deg); opacity: 0; }
    }
    .message {
      position: absolute;
      right: 8vw;
      top: 18vh;
      max-width: 460px;
      text-align: right;
    }
    .code { font-size: 96px; font-weight: 800; letter-spacing: 6px; color: #ffd27a; }
    h1 { font-size: 36px; margin: 8px 0 12px; }
    .ceci { font-size: 22px; font-style: italic; color: #ffd27a; margin-bottom: 16px; }
    .line { font-size: 18px; line-height: 1.5; margin-bottom: 28px; }
    .button {
      display: inline-block;
      padding: 14px 26px;
      border-radius: 30px;
      background: #ffd27a;
      color: #1b2a4a;
      font-weight: 700;
      text-decoration: none;
    }
    .button:hover { background: #fff8ec; }
    @media (max-width: 700px) {
      .message { left: 6vw; right: 6vw; top: 6vh; text-align: center; }
      .code { font-size: 64px; }
      h1 { font-size: 28px; }
      .cliff { width: 70vw; height: 40vh; }
      .page { left: 52vw; top: 58vh; }
    }
  </style>
</head>
<body>
  <div class="star" style="left:12%; top:8%"></div>
  <div class="star" style="left:30%; top:16%"></div>
  <div class="star" style="left:48%; top:6%"></div>
  <div class="star" style="left:66%; top:12%"></div>
  <div class="star" style="left:84%; top:5%"></div>

  <svg class="cliff" viewBox="0 0 400 600" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 80 L300 60 L320 120 L290 200 L330 300 L300 420 L340 600 L0 600 Z" fill="#2b1d2f"/>
    <rect x="236" y="20" width="6" height="44" fill="#8a6a4a"/>
    <rect x="196" y="4" width="86" height="30" rx="4" fill="#ffd27a"/>
    <text x="239" y="25" text-anchor="middle" font-size="14" font-weight="700" fill="#2b1d2f">DANGER!</text>
  </svg>

  <div class="page" aria-hidden="true"></div>

  <div class="message">
    <p class="code">404</p>
    <h1>This page is off the cliff</h1>
    <p class="ceci">Ceci n'est pas une page</p>
    <p class="line">It walked too close to the edge. We're still waiting for it to land.</p>
    <a class="button" href="/">Climb back up</a>
  </div>
</body>
</html>
